<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fc4c02">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Trackr">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Trackr</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --bg:#ffffff; --panel:#ffffff; --ink:#1b1b1f; --muted:#6b6b76; --line:#e4e4ea;
  --accent:#fc4c02; --accent-ink:#ffffff; --danger:#d92d20; --card:#f5f5f8;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#121214; --panel:#1b1b1f; --ink:#f2f2f5; --muted:#9a9aa6; --line:#2d2d34; --card:#24242a; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overscroll-behavior:none}
body{height:100dvh;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:manipulation;-webkit-touch-callout:none}
button{touch-action:manipulation}
.hero{padding:6px 16px 0;text-align:center;background:var(--panel)}
.hero .hl{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px}
.hero .hv{font-size:min(24vw,120px);font-weight:800;line-height:1;font-variant-numeric:tabular-nums;color:var(--ink);transition:color .2s}
.hero .hv.moving{color:var(--accent)}
.hero .hv small{font-size:.2em;font-weight:600;color:var(--muted);margin-left:6px}
.hero .hp{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--muted)}
#spark{width:100%;height:52px;display:block;margin-top:4px}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:6px 16px 8px;background:var(--panel);text-align:center}
.trio .stat .v{font-size:26px}
.lapbar{background:var(--card);padding:6px 16px;font-size:14px;font-variant-numeric:tabular-nums;display:flex;flex-direction:column;gap:1px}
.lapbar b{font-weight:700} .lapbar .prev{color:var(--muted)}
.mapwrap{position:relative;flex:1;min-height:90px;display:flex}
.lapwrap{flex:1;min-height:90px;display:flex;flex-direction:column;background:var(--bg)}
.lapwrap .lh{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 8px 4px 16px;font-size:14px;color:var(--muted)}
.lapwrap .lh b{color:var(--ink)}
.lapwrap .lh button{flex:none;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
.lapscroll{flex:1;min-height:0;overflow:auto;padding:0 16px}
.laptab{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.laptab th{position:sticky;top:0;background:var(--bg);font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;text-align:right;padding:4px 0 6px;border-bottom:1px solid var(--line)}
.laptab td{font-size:20px;font-weight:600;text-align:right;padding:9px 0;border-bottom:1px solid var(--line);white-space:nowrap}
.laptab th:first-child,.laptab td:first-child{text-align:left}
.laptab td:first-child{font-size:15px}
.laptab tr.now td{color:var(--accent)} .laptab tr.now td:first-child::before{content:'● ';font-size:11px;vertical-align:2px}
.laptab tr.easy td{color:var(--muted);font-weight:500}
.laptab td.ok{color:#16a34a} .laptab td.low{color:#f59e0b} .laptab td.high{color:#3b82f6}
.mapwrap .lapsbtn{right:auto;left:50%;transform:translateX(-50%)}
.sheet{padding-bottom:calc(14px + env(safe-area-inset-bottom))}
.types.locked{display:none}
.btn{min-height:60px}
.btn.lap{flex:1.5;font-size:21px}
#list{flex:1;min-height:0}
.tools{display:flex;gap:10px;padding:12px 16px 0}
.tools .btn{min-height:44px;font-size:15px}
.note{padding:6px 16px 0;font-size:12px;color:var(--muted)}
.lapt{display:flex;justify-content:space-between;font-size:14px;padding:5px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
#dLaps{max-height:22vh;overflow:auto;margin-bottom:10px}
header{display:flex;align-items:center;justify-content:space-between;padding:6px 16px;padding-top:calc(6px + env(safe-area-inset-top));background:var(--panel);border-bottom:1px solid var(--line)}
header h1{margin:0;font-size:18px;letter-spacing:.2px}
header h1 span{color:var(--accent)}
#gps{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
#gps i{width:9px;height:9px;border-radius:50%;background:var(--muted);display:inline-block}
#gps.ok i{background:#16a34a} #gps.weak i{background:#f59e0b} #gps.bad i{background:var(--danger)}
main{flex:1;position:relative;min-height:0}
.view{position:absolute;inset:0;display:none;flex-direction:column}
.view.on{display:flex}
#map{flex:1;min-height:0;background:var(--card)}
.sheet{background:var(--panel);border-top:1px solid var(--line);padding:12px 16px 14px}
.types{display:flex;gap:8px;margin-bottom:10px}
.types button{flex:1;padding:8px 2px;white-space:nowrap;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:14px;cursor:pointer}
.types button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.types.locked button{pointer-events:none;opacity:.6} .types.locked button.on{opacity:1}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:6px 12px;margin-bottom:12px}
.stat .v{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.stat .l{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
.stat.big .v{font-size:40px}
.controls{display:flex;gap:10px}
.btn{flex:1;padding:14px;border-radius:12px;border:0;font:inherit;font-weight:700;font-size:17px;cursor:pointer;background:var(--card);color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.danger{background:var(--danger);color:#fff}
.btn:disabled{opacity:.5}
.btn:focus-visible,.types button:focus-visible,nav button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
nav{display:flex;background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:12px;border:0;background:none;color:var(--muted);font:inherit;font-size:14px;font-weight:600;cursor:pointer;border-top:3px solid transparent}
nav button.on{color:var(--accent);border-top-color:var(--accent)}
#list{overflow:auto;padding:12px 16px;display:flex;flex-direction:column;gap:10px}
.card{background:var(--card);border-radius:14px;padding:14px;cursor:pointer;border:0;text-align:left;font:inherit;color:inherit;width:100%}
.card .t{font-weight:700} .card .d{font-size:13px;color:var(--muted);margin-bottom:6px}
.card .row{display:flex;gap:18px;font-variant-numeric:tabular-nums}
.card .row b{display:block;font-size:20px} .card .row span{font-size:11px;color:var(--muted);text-transform:uppercase}
.empty{color:var(--muted);text-align:center;margin-top:48px;padding:0 24px}
#dStats{grid-template-columns:repeat(3,1fr)}#dStats .v{font-size:22px}
.dlinks{display:flex;justify-content:center;gap:24px;margin-top:14px}.dlinks button{background:none;border:0;padding:8px;font:inherit;font-size:13px;color:var(--muted);text-decoration:underline;cursor:pointer}
#detail{position:absolute;inset:0;background:var(--bg);z-index:1000;display:none;flex-direction:column}
#detail.on{display:flex}
#dmap{flex:1;min-height:0}
.followbtn{position:absolute;right:12px;top:12px;z-index:500;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font:inherit;font-size:13px;cursor:pointer}
[hidden]{display:none !important}
input,select{-webkit-user-select:text;user-select:text}
.hero .hv.ok{color:#16a34a}.hero .hv.low{color:#f59e0b}.hero .hv.high{color:#3b82f6}
.plan{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 16px;color:#fff;background:#52525b}
.plan.work{background:var(--accent)}.plan.rest{background:#2563eb}
.plan .pl{font-size:13px;text-transform:uppercase;letter-spacing:.6px;font-weight:700}
.plan .pt{font-size:40px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.plan .pr{text-align:right;font-size:14px;line-height:1.35}
.planchip{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--card);padding:6px 8px 6px 16px;font-size:14px}
.planchip button{border:0;background:none;color:var(--muted);font:inherit;font-size:22px;cursor:pointer;padding:2px 10px}
#todayView,#gymView{overflow:auto;padding:12px 16px 20px;gap:12px}
.fld textarea{background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;font-size:16px;width:100%;resize:vertical}
#gymView{padding-bottom:0}#gymBody{display:flex;flex-direction:column;gap:12px;min-height:100%}
.ghd{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 0 -2px}
.ghd h1{margin:0;font-size:24px;font-weight:800;letter-spacing:.3px;text-transform:uppercase}
.gtpl{display:block;width:100%;text-align:left;font:inherit;color:var(--ink)}
.gtpl .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.gtpl .nm{font-size:20px;font-weight:800;line-height:1.2}
.gbadge{flex:none;width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:16px}
.gexl{margin-top:10px}.gexl div{display:flex;justify-content:space-between;gap:10px;padding:4px 0;font-size:15px}.gexl b{font-variant-numeric:tabular-nums}
.glink{border:0;background:none;color:var(--accent);font:inherit;font-weight:600;cursor:pointer;padding:6px 0}
.grow2{display:flex;gap:8px;margin-top:12px}.grow2 .btn{min-height:46px;font-size:15px}
.gfab{position:sticky;bottom:14px;align-self:flex-end;margin-top:auto;border:0;border-radius:999px;padding:14px 26px;background:var(--accent);color:var(--accent-ink);font:inherit;font-weight:800;font-size:16px;letter-spacing:.5px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.3);z-index:5}
.gs{border-top:1px solid var(--line);padding:10px 0;display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.gs:first-of-type{border-top:0}
.gs .gn{white-space:pre-wrap;font-size:13px;color:var(--muted);margin-top:4px}
.gx{border:0;background:none;color:var(--muted);font-size:20px;cursor:pointer;padding:0 6px;line-height:1}
.gedrow{display:grid;grid-template-columns:1fr 52px 52px 64px 28px;gap:6px;align-items:end;margin-top:8px}
.gedrow input{background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px 6px;font:inherit;font-size:16px;width:100%;min-width:0;text-align:center}
.gedrow input.n{text-align:left;padding-left:10px}
.gedhd{display:grid;grid-template-columns:1fr 52px 52px 64px 28px;gap:6px;font-size:11px;color:var(--muted);margin-top:10px;text-align:center}.gedhd span:first-child{text-align:left}
.gtitle{width:100%;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:12px;font:inherit;font-size:18px;font-weight:700}
.glive-hd{display:flex;align-items:center;gap:10px;position:sticky;top:-12px;background:var(--bg);padding:8px 0;z-index:4}
.glive-hd .t{flex:1;min-width:0}.glive-hd .t div:first-child{font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.glive-hd .clock{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.gback{border:0;background:var(--card);color:var(--ink);border-radius:10px;width:42px;height:42px;font-size:22px;cursor:pointer;flex:none}
.gex .eh{display:flex;align-items:center;gap:10px;cursor:pointer}
.gex .eh .chev{color:var(--muted);width:18px;text-align:center;font-size:14px;flex:none}
.gex .eh .nm{flex:1;font-weight:800;font-size:17px;line-height:1.25}
.gex .eh .sub{font-weight:400;font-size:13px;color:var(--muted);margin-top:2px}
.gset{display:grid;grid-template-columns:30px 22px 1fr 30px 1fr 40px;align-items:center;gap:6px;background:var(--bg);border-radius:12px;padding:8px 10px;margin-top:8px;border-left:4px solid transparent}
.gset.next{border-left-color:var(--accent)}.gset.done{opacity:.6}
.gset .ck{width:26px;height:26px;border-radius:50%;border:2px solid var(--muted);background:none;cursor:pointer;padding:0;color:#fff;font-size:14px;font-weight:800}
.gset.done .ck{background:#16a34a;border-color:#16a34a}
.gset .ix{font-weight:800}
.gset input{background:var(--card);color:var(--ink);border:0;border-radius:10px;padding:10px 4px;font:inherit;font-size:18px;font-weight:700;text-align:center;width:100%;min-width:0}
.gset input::-webkit-inner-spin-button,.gset input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}.gset input{-moz-appearance:textfield}
.gset small{font-size:12px;font-weight:700;color:var(--muted)}
.gadd{display:block;width:100%;margin-top:8px;border:0;border-radius:12px;padding:12px;background:var(--bg);color:var(--ink);font:inherit;font-weight:700;cursor:pointer}
.gbar2{position:sticky;bottom:0;margin:auto -16px 0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:var(--panel);border-top:1px solid var(--line);display:flex;gap:8px;z-index:5}
.gbar2 .btn{min-height:52px;font-size:15px}.gbar2 .btn.primary{flex:2;letter-spacing:.5px}
.plan.easy{background:#0f766e}.plan.test{background:var(--accent)}
details.more>summary{cursor:pointer;font-weight:700;background:var(--card);border-radius:14px;padding:14px}
details.more .mbody{display:flex;flex-direction:column;gap:12px;margin-top:12px}
.goalnum{font-size:40px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.gbar{height:6px;background:var(--bg);border-radius:3px;margin-top:10px;overflow:hidden}.gbar i{display:block;height:100%;background:var(--accent)}
.wkrow{display:flex;justify-content:space-between;gap:4px;margin-top:4px}
.wd{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--muted)}
.wd .c{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;border:2px solid var(--line);color:var(--ink);background:var(--card)}
.wd .c.done{border-color:transparent;color:#fff}.wd .c.plan{border-style:dashed}
.wd.today b{color:var(--ink)}.wd.today .c{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--accent)}
.k-hard,.wd .c.done.k-hard{background:#dc2626}.k-easy,.wd .c.done.k-easy{background:#16a34a}.k-long,.wd .c.done.k-long{background:#2563eb}.k-str,.wd .c.done.k-str{background:#9333ea}.k-walk,.wd .c.done.k-walk{background:#64748b}.k-test,.wd .c.done.k-test{background:#d97706}
.c.plan.k-hard,.c.plan.k-easy,.c.plan.k-long,.c.plan.k-test{background:transparent!important}
.c.plan.k-hard{border-color:#dc2626}.c.plan.k-easy{border-color:#16a34a}.c.plan.k-long{border-color:#2563eb}.c.plan.k-test{border-color:#d97706}
.wklg{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:10px;font-size:11px;color:var(--muted)}.wklg i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:-1px}
.spark{display:block;width:100%;height:40px;margin-top:8px}
.ttl{font-size:22px;font-weight:800;line-height:1.2}
.pill{display:inline-block;background:var(--bg);border-radius:999px;padding:4px 11px;font-size:13px;margin:6px 6px 0 0;font-variant-numeric:tabular-nums}
.spot{font-size:13px;color:var(--muted);margin-top:6px}
.prow{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px;font-variant-numeric:tabular-nums}
.prow:last-of-type{border:0}.prow b{white-space:nowrap}.prow span{text-align:right;color:var(--muted)}
.why{margin:10px 0 12px;padding-left:18px;color:var(--muted);font-size:14px}.why li{margin:4px 0}
.alt{display:flex;gap:8px;margin-top:8px}
.alt button{flex:1;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:11px 8px;font:inherit;font-size:14px;cursor:pointer}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.chips button{width:46px;padding:9px 0;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:13px;cursor:pointer}
.chips button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
details.panel summary{cursor:pointer;font-weight:700}
.panel{background:var(--card);border-radius:14px;padding:14px;flex:none}
.panel h2{margin:0 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted)}
.vbig{font-size:56px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.vsub{color:var(--muted);font-size:13px;margin-top:4px}
#vchart{width:100%;height:130px;display:block;margin-top:10px}
.zone{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:15px;font-variant-numeric:tabular-nums}
.zone:last-child{border:0}.zone small{color:var(--muted);font-size:12px;display:block}.zone .r{text-align:right}
.sess{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.sess b{display:block}.sess small{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.sess .btn{flex:none;min-height:40px;padding:8px 18px;font-size:15px}
.wk{display:flex;align-items:flex-end;gap:6px;height:100px;margin-top:6px}
.wk div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:3px;height:100%;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.wk i{display:block;width:100%;background:var(--accent);border-radius:4px 4px 0 0;min-height:2px}
.fld{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:flex-end}
.fld label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:2px}
.fld input,.fld select{background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;font-size:16px;width:84px}
.fld select{width:auto}
.sbtn{border:0;border-radius:10px;padding:11px 16px;background:var(--ink);color:var(--bg);font:inherit;font-weight:700;cursor:pointer}
.seg{display:flex;gap:6px;margin-bottom:6px}
.seg button{flex:1;padding:8px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:13px;cursor:pointer}
.seg button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg button:disabled{opacity:.4}
.lapt.work b{color:var(--accent)}
#detail .sheet{max-height:62vh;overflow:auto}
#actView{overflow:auto}#list{flex:none;overflow:visible}
.pbt{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums;margin-top:8px}
.pbt th{font-weight:600;color:var(--muted);text-align:right;padding:4px 6px;white-space:nowrap}.pbt th:first-child,.pbt td:first-child{text-align:left}
.pbt td{padding:5px 6px;border-top:1px solid var(--line);text-align:right;white-space:nowrap}.pbt td:first-child{font-weight:600}
.pbt td.best{color:var(--accent);font-weight:700}.pbw{overflow-x:auto;margin:0 -4px}
.repsum{color:var(--ink);font-size:14px;margin-bottom:6px}.repsum b{color:var(--accent)}
.vlog{display:flex;justify-content:space-between;align-items:center;font-size:14px;padding:4px 0;font-variant-numeric:tabular-nums}
.vlog button{border:0;background:none;color:var(--muted);font-size:18px;cursor:pointer;padding:0 8px}
.recstate{display:flex;align-items:center;gap:8px;font-size:14px;margin-bottom:8px;color:var(--muted)}
.recstate i{width:10px;height:10px;border-radius:50%;background:var(--muted);flex:none}
.recstate.rec{color:var(--ink)}.recstate.rec i{background:var(--danger);animation:pulse 1.2s infinite}
.recstate.pause i{background:#f59e0b}
@keyframes pulse{50%{opacity:.3}}
#controls{flex-wrap:wrap}
.btn.fin{flex:1;padding-left:6px;padding-right:6px;background:transparent;border:2px solid var(--danger);color:var(--danger)}
#controls .btn:not(.lap):not(.primary){padding-left:6px;padding-right:6px}
.mini{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
.planchip{flex-wrap:wrap}
.why-p{margin:8px 0 0;font-size:14px;line-height:1.45}
.sumbox{width:100%;height:160px;margin-top:10px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px;font:12px/1.4 ui-monospace,Consolas,monospace;user-select:text}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:3000;max-width:90vw;text-align:center}
</style>
</head>
<body>
<header>
  <h1>Track<span>r</span></h1>
  <div id="gps"><i></i><span id="gpsText">Waiting for GPS…</span></div>
</header>

<main>
  <section id="todayView" class="view on">
    <div class="panel" id="tWeek"></div>
  </section>

  <section id="gymView" class="view"><div id="gymBody"></div></section>

  <section id="recView" class="view">
    <div class="hero">
      <div class="hv" id="curBox"><span id="curSpd">--</span><small>min/km</small></div>
      <canvas id="spark" aria-label="Speed over the last two minutes"></canvas>
    </div>
    <div class="trio">
      <div class="stat"><div class="v" id="sTime">0:00</div><div class="l">Time</div></div>
      <div class="stat"><div class="v" id="sDist">0.00</div><div class="l">km</div></div>
      <div class="stat"><div class="v" id="sPace">--</div><div class="l" id="sPaceL">Avg min/km</div></div>
    </div>
    <div class="planchip" id="planChip" hidden><span id="planChipTxt"></span><button id="planWarm" class="mini" hidden></button><button id="planClear" aria-label="Clear plan">×</button></div>
    <div class="plan" id="planBar" hidden>
      <div><div class="pl" id="plLabel"></div><div class="pt" id="plTime"></div></div>
      <div class="pr" id="plTarget"></div>
    </div>
    <div class="lapbar" id="lapbar" hidden>
      <div id="lapNow"></div>
      <div class="prev" id="lapPrev"></div>
    </div>
    <div class="lapwrap" id="lapWrap" hidden>
      <div class="lh"><span id="lapSum"></span><button id="lapMapBtn">Show map</button></div>
      <div class="lapscroll"><table class="laptab"><thead><tr><th>Lap</th><th>Time</th><th>km</th><th>Pace</th></tr></thead><tbody id="lapRows"></tbody></table></div>
    </div>
    <div class="mapwrap" id="mapWrap">
      <div id="map"></div>
      <button class="followbtn lapsbtn" id="lapBackBtn" hidden>Show laps</button>
      <button class="followbtn" id="followBtn" aria-pressed="true">Following</button>
      <button class="followbtn layerbtn" aria-pressed="false" style="right:auto;left:12px">Satellite</button>
    </div>
    <div class="sheet">
      <div class="recstate" id="recState"></div>
      <div class="types" id="types" role="group" aria-label="Activity type">
        <button data-type="Interval" class="on">Interval</button>
        <button data-type="Pace">Pace</button>
        <button data-type="Long run">Long run</button>
        <button data-type="Walking">Walking</button>
      </div>
      <div class="controls" id="controls"></div>
    </div>
  </section>


  <section id="actView" class="view">
    <div class="tools">
      <button class="btn" id="expAll">Back up all</button>
      <button class="btn" id="impAll">Restore</button>
      <input type="file" id="impFile" accept="application/json,.json" hidden>
    </div>
    <details class="panel" id="cloud" style="margin:12px 16px 0">
      <summary>Cloud sync <span id="cloudBadge" style="font-weight:400;color:var(--muted);font-size:13px"></span></summary>
      <div class="vsub" id="cloudMsg" style="margin-top:8px;line-height:1.5"></div>
      <div class="tools" style="padding:10px 0 0"><button class="btn" id="cloudNow">Sync now</button></div>
    </details>
    <div id="list"></div>
  </section>

  <div id="detail">
    <div style="position:relative;flex:1;min-height:0;display:flex">
      <div id="dmap" style="flex:1"></div>
      <button class="followbtn layerbtn" aria-pressed="false">Satellite</button>
    </div>
    <div class="sheet">
      <div class="t" id="dTitle" style="font-weight:700;font-size:18px"></div>
      <div class="d" id="dDate" style="color:var(--muted);font-size:13px;margin-bottom:10px"></div>
      <div class="stats" id="dStats"></div>
      <canvas id="dChart" aria-label="Speed through the run" style="width:100%;height:96px;display:none;margin:0 0 8px"></canvas>
      <div class="vsub" id="dReps" style="margin:0 0 10px"></div>
      <div class="vsub" id="dCoach" style="margin:0 0 10px"></div>
      <div id="dLaps"></div>
      <div class="dlinks"><button id="dGpx">Export GPX</button><button id="dDel">Delete</button></div>
    </div>
  </div>
</main>

<nav>
  <button id="tabToday" class="on">Today</button>
  <button id="tabRec">Record</button>
  <button id="tabGym">Gym</button>
  <button id="tabAct">Activities</button>
</nav>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(function(){
"use strict";
const $ = s => document.querySelector(s);
const store = {
  get(k, d){ try{ const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; }catch(e){ return d; } },
  set(k, v){
    try{
      const prev = store.onSet && k === 'trackr.acts' ? localStorage.getItem(k) : null;   // cloud sync diffs the activity list to find what changed
      localStorage.setItem(k, JSON.stringify(v));
      if(store.onSet) try{ store.onSet(k, v, prev); }catch(e){}
    }catch(e){}
  },
  del(k){ try{ localStorage.removeItem(k); if(store.onSet) try{ store.onSet(k, null, null); }catch(e){} }catch(e){} },
  onSet: null   // set by the cloud sync block below
};

/* ---------- helpers ---------- */
const MAX_ACCURACY = 35;   // metres: ignore fixes worse than this
const MIN_STEP = 3;        // metres: ignore jitter smaller than this
const MAX_SPEED = 25;      // m/s: ignore GPS teleports
function hav(a, b){
  const R = 6371000, r = Math.PI/180;
  const dLat = (b[0]-a[0])*r, dLon = (b[1]-a[1])*r;
  const x = Math.sin(dLat/2)**2 + Math.cos(a[0]*r)*Math.cos(b[0]*r)*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(x));
}
function fmtTime(ms){
  const s = Math.floor(ms/1000), h = Math.floor(s/3600), m = Math.floor(s%3600/60), sec = s%60;
  const p = n => String(n).padStart(2,'0');
  return h ? `${h}:${p(m)}:${p(sec)}` : `${m}:${p(sec)}`;
}
function fmtPaceSec(spk){
  if(!isFinite(spk) || spk > 3599) return '--';
  const s = Math.round(spk);
  return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
}
function fmtPace(ms, m){
  if(m < 10) return '--';
  return fmtPaceSec(ms/m);   // ms per metre == seconds per km
}
function fmtSpeed(ms, m){
  if(m < 10 || ms <= 0) return '--';
  return (m/1000/(ms/3600000)).toFixed(1);
}
const isRide = t => t === 'Ride';
function toast(msg){
  const el = document.createElement('div'); el.className = 'toast'; el.textContent = msg;
  document.body.appendChild(el); setTimeout(() => el.remove(), 3200);
}
const baseMaps = [];   // one entry per Leaflet map: {map, street, sat}
let satellite = store.get('trackr.sat', false) === true;
function tile(map){
  const street = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19, attribution: '&copy; OpenStreetMap contributors'
  });
  const sat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
    maxZoom: 19, attribution: 'Tiles &copy; Esri, Maxar, Earthstar Geographics'
  });
  baseMaps.push({ map, street, sat });
  (satellite ? sat : street).addTo(map);
}
function setSatellite(v){
  satellite = v; store.set('trackr.sat', v);
  baseMaps.forEach(b => {
    b.map.removeLayer(v ? b.street : b.sat);
    (v ? b.sat : b.street).addTo(b.map);
  });
  document.querySelectorAll('.layerbtn').forEach(b => { b.textContent = v ? 'Map' : 'Satellite'; b.setAttribute('aria-pressed', String(v)); });
}

/* ---------- map ---------- */
const map = L.map('map', {zoomControl:false}).setView([3.139, 101.687], 15);
tile(map);
L.control.zoom({position:'bottomright'}).addTo(map);
const route = L.polyline([], {color:'#fc4c02', weight:5, opacity:.95}).addTo(map);
let me = null, meDot = null, meAcc = null, follow = true;
map.on('dragstart', () => setFollow(false));
function setFollow(v){
  follow = v;
  const b = $('#followBtn');
  b.textContent = v ? 'Following' : 'Re-centre';
  b.setAttribute('aria-pressed', String(v));
}
document.querySelectorAll('.layerbtn').forEach(b => {
  b.onclick = () => setSatellite(!satellite);
  b.textContent = satellite ? 'Map' : 'Satellite';
});
$('#followBtn').onclick =() => { setFollow(true); if(me) map.setView(me, Math.max(map.getZoom(), 16)); };

/* ---------- activity state ---------- */
let act = null;            // {type, segs:[[ [lat,lon,alt,t] ]], dist, gain, refAlt, elapsed, tickAt, status, startedAt}
let type = 'Interval';
let wakeLock = null;

function elapsedNow(){
  if(!act) return 0;
  return act.elapsed + (act.status === 'running' ? Date.now() - act.tickAt : 0);
}
// The draft is the whole activity so far, so write it at most every 3 s (immediately at key moments), plus whenever the page is hidden.
let lastDraft = 0;
function saveDraft(force){
  if(!act) return;
  const now = Date.now(); if(!force && now - lastDraft < 3000) return;
  lastDraft = now; store.set('trackr.draft', act);
}
window.addEventListener('pagehide', () => saveDraft(true));
document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'hidden') saveDraft(true); });

function render(){
  const ms = elapsedNow(), d = act ? act.dist : 0;
  const ride = isRide(act ? act.type : type);
  $('#sTime').textContent = fmtTime(ms);
  $('#sDist').textContent = (d/1000).toFixed(2);
  $('#sPace').textContent = ride ? fmtSpeed(ms, d) : fmtPace(ms, d);
  $('#sPaceL').textContent = ride ? 'Avg km/h' : 'Avg min/km';
  $('#types').classList.toggle('locked', !!act);
  route.setLatLngs(act ? act.segs.map(s => s.map(p => [p[0], p[1]])) : []);
  renderPlan();
  renderLap();
  renderLapTable();
  renderControls();
  renderState();
}
// A one-word status while an activity is open; nothing at all before Start (the Start button says enough).
function renderState(){
  const el = $('#recState'); if(!el) return;
  el.hidden = !act; if(!act) return;
  let cls, txt;
  if(act.status === 'running') { cls = 'rec'; txt = act.plan && act.plan.done ? 'Recording · plan complete' : 'Recording'; }
  else { cls = 'pause'; txt = 'Paused'; }
  el.className = 'recstate ' + cls; el.innerHTML = `<i></i><span>${txt}</span>`;
}
function lapLine(label, ms, d){
  return `<b>${label}</b> · ${fmtTime(ms)} · ${(d/1000).toFixed(2)} km · ${fmtPace(ms, d)} min/km`;
}
function renderLap(){
  const bar = $('#lapbar');
  bar.hidden = !act || (act.plan && !act.plan.done) || lapMode();
  if(bar.hidden) return;
  const n = act.laps.length;
  $('#lapNow').innerHTML = lapLine(`Lap ${n + 1}`, elapsedNow() - act.lapT0, act.dist - act.lapD0);
  $('#lapPrev').innerHTML = n ? 'Last: ' + lapLine(act.laps[n-1].label || `Lap ${n}`, act.laps[n-1].time, act.laps[n-1].dist).replace(/<\/?b>/g, '') : 'Tap LAP at each change of pace';
}
// Interval mode: a lap table replaces the map (pace per rep matters more than the route). Long runs and easy runs keep the map.
let mapPeek = false;   // "Show map" while in interval mode; reset when the mode changes
function lapMode(){
  const t = act ? act.type : type, plan = act ? act.plan : pendingPlan;
  return t === 'Interval' || !!(plan && plan.phases.some(ph => ph.kind === 'work'));
}
function lapPaceCls(l){   // a rep with a target: green on target, amber too slow, blue too fast
  if(!l.lo || l.dist < 10) return '';
  const v = l.dist/(l.time/1000);
  return v < l.lo ? 'low' : v > l.hi ? 'high' : 'ok';
}
let lastMapShown = true;
function renderLapTable(){
  const on = lapMode(), table = on && !mapPeek;
  $('#lapWrap').hidden = !table; $('#mapWrap').hidden = table; $('#lapBackBtn').hidden = !on;
  if(!table && !lastMapShown) setTimeout(() => map.invalidateSize(), 0);   // Leaflet needs a nudge after being hidden
  lastMapShown = !table;
  if(!table) return;
  const rows = [];
  if(act){
    const ph = curPhase(), done = act.plan && act.plan.done;
    rows.push({ label: ph ? ph.label : done ? 'After plan' : `Lap ${act.laps.length + 1}`, kind: ph ? ph.kind : '', lo: ph && ph.lo, hi: ph && ph.hi,
                time: elapsedNow() - act.lapT0, dist: act.dist - act.lapD0, now: true });
    for(let i = act.laps.length - 1; i >= 0; i--) rows.push(Object.assign({ label: `Lap ${i + 1}` }, act.laps[i]));
  }
  const quiet = new Set(['rest', 'warm', 'cool']);
  $('#lapRows').innerHTML = rows.length ? rows.map(l =>
    `<tr class="${l.now ? 'now' : ''} ${quiet.has(l.kind) ? 'easy' : ''}"><td>${l.label}</td><td>${fmtTime(l.time)}</td><td>${(l.dist/1000).toFixed(2)}</td>` +
    `<td class="${l.now ? '' : lapPaceCls(l)}">${fmtPace(l.time, l.dist)}</td></tr>`).join('')
    : '';
  const reps = act ? act.laps.filter(l => l.kind === 'work' && l.dist >= 10) : [];
  const total = act && act.plan ? act.plan.phases.filter(x => x.kind === 'work').length : 0;
  if(reps.length){
    const t = reps.reduce((a, l) => a + l.time, 0), d = reps.reduce((a, l) => a + l.dist, 0);
    $('#lapSum').innerHTML = `Reps <b>${reps.length}${total ? '/' + total : ''}</b> · avg <b>${fmtPace(t, d)}</b> min/km`;
  } else $('#lapSum').textContent = act ? `${act.laps.length} lap${act.laps.length === 1 ? '' : 's'}` : '';
}
$('#lapMapBtn').onclick = () => { mapPeek = true; render(); };
$('#lapBackBtn').onclick = () => { mapPeek = false; render(); };
function renderControls(){
  const c = $('#controls'); c.innerHTML = '';
  const add = (label, cls, fn) => { const b = document.createElement('button'); b.className = 'btn ' + cls; b.textContent = label; b.onclick = fn; c.appendChild(b); };
  if(!act) add('Start', 'primary', start);
  else if(act.status === 'running'){
    if(act.plan && !act.plan.done) add('Next', 'primary lap', () => advancePhase(true)); else add('LAP', 'primary lap', lap);
    add('Pause', '', pause);
    add('Finish', 'fin', () => { if(confirm('Finish and save this activity?')) finish(); });
  }
  else { add('Resume', 'primary', resume); add('Finish', 'danger', finish); }
}

/* ---------- structured sessions ---------- */
let pendingPlan = null;     // {name, phases:[{kind,dur,label,lo,hi}]}  lo/hi in m/s
let actx = null;
function beep(freq, ms){
  try{
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if(actx.state === 'suspended') actx.resume();
    const o = actx.createOscillator(), g = actx.createGain();
    o.frequency.value = freq; g.gain.value = .3; o.connect(g); g.connect(actx.destination);
    o.start(); o.stop(actx.currentTime + ms/1000);
  }catch(e){}
}
function cue(kind){
  if(kind === 'work' || kind === 'test'){ beep(988, 180); setTimeout(() => beep(988, 180), 260); buzz([200, 100, 200]); }
  else if(kind === 'end'){ beep(784, 200); setTimeout(() => beep(988, 200), 260); setTimeout(() => beep(1175, 350), 520); buzz([300, 100, 300, 100, 300]); }
  else { beep(523, 350); buzz(350); }
}
function curPhase(){ return act && act.plan && !act.plan.done ? act.plan.phases[act.plan.idx] : null; }
function advancePhase(skipped){
  const p = act.plan, ph = p.phases[p.idx], ms = elapsedNow();
  const bound = skipped ? ms : p.t0 + ph.dur*1000;       // natural ends land exactly on the boundary, so phases never drift
  act.laps.push({ time: Math.max(0, bound - act.lapT0), dist: act.dist - act.lapD0, label: ph.label, kind: ph.kind, dur: ph.dur*1000, lo: ph.lo, hi: ph.hi });
  act.lapT0 = bound; act.lapD0 = act.dist; p.t0 = bound; p.idx++; p.lastTick = -1;
  if(p.idx >= p.phases.length){ p.done = true; cue('end'); } else cue(p.phases[p.idx].kind);
  saveDraft(true); render();
}
// Summarise how a structured session went, so the coach can adapt the next one.
const MEASURED = new Set(['work', 'easy', 'test']);
function coachResult(laps){
  const p = act.plan; if(!p) return undefined;
  const total = p.phases.filter(x => MEASURED.has(x.kind)).length;
  const good = laps.filter(l => MEASURED.has(l.kind) && l.dur && l.time >= 0.8*l.dur);
  const t = good.reduce((s, l) => s + l.time, 0), d = good.reduce((s, l) => s + l.dist, 0);
  const tgt = p.phases.find(x => MEASURED.has(x.kind) && x.lo);
  const full = laps.filter(l => l.kind === 'test' && l.dur && l.time >= 0.95*l.dur);
  return { kind: p.ckind, level: p.level, done: good.length, total, avg: t ? d/(t/1000) : 0, lo: tgt ? tgt.lo : undefined, hi: tgt ? tgt.hi : undefined,
           testDist: full.length ? full[0].dist : undefined };
}
function planTick(){
  if(!act || act.status !== 'running' || !act.plan) return;
  for(let guard = 0; guard < 40 && !act.plan.done; guard++){
    const p = act.plan, ph = p.phases[p.idx], left = ph.dur*1000 - (elapsedNow() - p.t0);
    if(left <= 0){ advancePhase(false); continue; }
    const s = Math.ceil(left/1000);
    if(s <= 3 && p.lastTick !== s){ p.lastTick = s; beep(660, 90); }
    break;
  }
}
function renderPlan(){
  const chip = $('#planChip'), bar = $('#planBar');
  chip.hidden = !(pendingPlan && !act);
  if(!chip.hidden){
    const warm = pendingPlan.phases[0] && pendingPlan.phases[0].kind === 'warm' ? pendingPlan.phases[0] : null, wb = $('#planWarm');
    $('#planChipTxt').textContent = warm
      ? (pendingPlan.skipWarm ? `Plan: ${pendingPlan.name}. Warm-up skipped: the main part starts the moment you press Start.`
                               : `Plan: ${pendingPlan.name}. Press Start to begin recording; it starts with a warm-up of ${fmtDur(warm.dur)}.`)
      : `Plan: ${pendingPlan.name}. Press Start when you are ready.`;
    wb.hidden = !warm; if(warm) wb.textContent = pendingPlan.skipWarm ? 'Include warm-up' : 'Already warmed up';
  }
  const p = act && act.plan;
  bar.hidden = !p;
  if(!p) return;
  if(p.done){
    bar.className = 'plan'; $('#plLabel').textContent = 'Session complete'; $('#plTime').textContent = '✓';
    $('#plTarget').textContent = 'Jog or walk, then Finish'; return;
  }
  const ph = p.phases[p.idx], nx = p.phases[p.idx + 1];
  const left = Math.max(0, ph.dur*1000 - (elapsedNow() - p.t0));
  bar.className = 'plan ' + ph.kind;
  $('#plLabel').textContent = ph.label;
  $('#plTime').textContent = fmtTime(Math.ceil(left/1000)*1000);
  $('#plTarget').innerHTML = (ph.lo ? `Target <b>${fmtPaceSec(1000/ph.hi)}–${fmtPaceSec(1000/ph.lo)}</b> min/km<br>` : '') +
    (nx ? `Next: ${nx.label}${nx.lo ? ` @ ${fmtPaceSec(1000/nx.hi)}–${fmtPaceSec(1000/nx.lo)}` : ''}` : 'Last phase');
}
$('#planClear').onclick = () => { pendingPlan = null; renderPlan(); };
$('#planWarm').onclick = () => { if(pendingPlan){ pendingPlan.skipWarm = !pendingPlan.skipWarm; renderPlan(); } };
function buzz(p){ try{ navigator.vibrate && navigator.vibrate(p); }catch(e){} }
function lap(){
  const ms = elapsedNow(), time = ms - act.lapT0, dist = act.dist - act.lapD0;
  if(time < 2000) return;
  act.laps.push({ time, dist, label: `Lap ${act.laps.length + 1}` });
  act.lapT0 = ms; act.lapD0 = act.dist;
  buzz(40); saveDraft(true); render();
}

async function lockScreen(){
  try{ if('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); }catch(e){}
}
function unlockScreen(){ try{ wakeLock && wakeLock.release(); }catch(e){} wakeLock = null; }
document.addEventListener('visibilitychange', () => {
  if(document.visibilityState === 'visible' && act && act.status === 'running') lockScreen();
});

function start(){
  if(!me) toast('No GPS fix yet — your route starts once it locks on.');
  act = { type, segs:[[]], dist:0, gain:0, refAlt:null, elapsed:0, tickAt:Date.now(), status:'running', startedAt:Date.now(), laps:[], lapT0:0, lapD0:0 };
  if(pendingPlan){
    act.type = pendingPlan.type || 'Interval';
    act.plan = { name: pendingPlan.name, phases: pendingPlan.phases, ckind: pendingPlan.ckind, level: pendingPlan.level, idx:0, t0:0, done:false, lastTick:-1 };
    // "Already warmed up": go straight to the main part so the warm-up is not recorded as a phase
    if(pendingPlan.skipWarm && act.plan.phases[0].kind === 'warm'){ act.plan.idx = 1; act.plan.warmSkipped = true; }
    cue(act.plan.idx ? act.plan.phases[act.plan.idx].kind : 'rest');   // the first beep also unlocks audio, which browsers only allow after a tap
    pendingPlan = null;
  }
  buzz(60); lockScreen(); enableMotion(); saveDraft(true); render(); syncGps(true);
}
function pause(){
  act.elapsed += Date.now() - act.tickAt; act.status = 'paused';
  unlockScreen(); disableMotion(); saveDraft(true); render(); syncGps();
}
function resume(){
  act.tickAt = Date.now(); act.status = 'running'; act.segs.push([]); act.lastFix = null;
  beep(1, 1);   // wake the audio context from this tap so phase beeps keep working
  lockScreen(); enableMotion(); saveDraft(true); render(); syncGps(true);
}
function finish(){
  if(act.status === 'running') act.elapsed += Date.now() - act.tickAt;
  act.status = 'done';
  unlockScreen(); disableMotion(); syncGps();
  if(act.dist < 20){
    if(!confirm('That activity is under 20 m. Discard it?')){ act.status = 'paused'; act.tickAt = Date.now(); saveDraft(true); render(); return; }

    }
    ph.push({ kind:'cool', dur:300, label:'Cool-down' });

function describePlan(plan){
  const ph = plan.phases, rows = [], pc = x => fmtPaceSec(1000/x);

    const p = ph[i];
    if(p.kind === 'work'){
      let j = i, reps = 0; while(j < ph.length && (ph[j].kind === 'work' || ph[j].kind === 'rest')){ if(ph[j].kind === 'work') reps++; j++; }
      const rest = ph.slice(i, j).find(x => x.kind === 'rest');
      rows.push([`${reps} × ${fmtDur(p.dur)}`, `${band(p.lo, p.hi)}${rest ? `<br>rest ${fmtDur(rest.dur)} jog` : ''}`]);
      i = j; continue;
    }
    if(p.kind === 'warm') rows.push(['Warm-up', `${fmtDur(p.dur)} easy walk/jog`]);
    else if(p.kind === 'cool') rows.push(['Cool-down', `${fmtDur(p.dur)} easy walk/jog`]);
    else if(p.kind === 'easy') rows.push([fmtDur(p.dur), `${band(p.lo, p.hi)}`]);

// How a coached session went, in plain words.
function coachNote(c){
  if(!c || !c.total) return '';
  const verdict = () => !c.lo || !c.done ? '' : c.avg < c.lo*.97 ? 'a bit slower than the target' : c.avg > c.hi*1.03 ? (c.kind === 'easy' || c.kind === 'long' ? 'faster than easy, so ease off next time' : 'faster than the target') : 'right on target';
  if(c.kind === 'test') return c.testDist ? `12-minute test: ${Math.round(c.testDist)} m, which gives a VO2max of ${((c.testDist - 504.9)/44.73).toFixed(1)}` : 'The 12-minute test was not completed, so no VO2max was recorded';
  if(c.kind === 'interval' || c.kind === 'pace'){
    let s = `${c.done} of ${c.total} reps completed`;
    if(c.lo && c.done) s += `. Average pace in the reps ${kmh(c.avg)} min/km (target ${band(c.lo, c.hi)}), ${verdict()}`;
    return s;
  }
  let s = c.done ? 'Steady run completed' : 'Steady run not completed';
  if(c.lo && c.done) s += `. Average ${kmh(c.avg)} min/km (easy range ${band(c.lo, c.hi)}), ${verdict()}`;
  return s;
}
// Speed in each 3 minutes of the 12-minute test, from the speed profile
function testSplits(a){
  const p = a.prof; if(!p || !a.laps) return null;
  let start = 0; for(const l of a.laps){ if(l.kind === 'test') break; start += l.time/1000; }
  const i0 = Math.round(start/p.s), n = Math.round(720/p.s), bins = p.v.slice(i0, i0 + n);
  if(bins.length < n*0.9) return null;
  const out = [];
  for(let k = 0; k < 4; k++){ const s = bins.slice(Math.round(k*bins.length/4), Math.round((k + 1)*bins.length/4)); out.push(s.reduce((x, y) => x + y, 0)/s.length/10); }
  return out;
}
// The "done for today" card: what happened, what it means, what comes next

        <p class="why-p">${q ? `That is ${q.txt} for ${who}: the <b>${fitBand(q.p)}</b> band.` : 'Add your birth date and sex in Coach settings below to see where this puts you.'} It is saved as your VO2max, and every target in the app now uses it.</p>`;
      const sp = testSplits(a);
      if(sp){

        html += `<p class="why-p">Your pace in each 3 minutes: ${sp.map(x => fmtPaceSec(3600/x)).join(' → ')} min/km. ${spread > 0.12 ? 'That is uneven. A fast start or a late sprint usually means an even pace would score higher.' : 'Nicely even, which is what a good test looks like.'}</p>`;

}
let brief = null;
function coachBrief(){
  const est = vo2Estimates(), ref = reference(est), cfg = coachCfg(), acts = runsOnly(), dow = new Date().getDay();
  const last = acts[0], since = last ? daysAgo(last.date) : Infinity;
  const km7 = acts.filter(a => daysAgo(a.date) <= 6).reduce((s, a) => s + a.dist, 0)/1000;
  const km28 = acts.filter(a => daysAgo(a.date) <= 27).reduce((s, a) => s + a.dist, 0)/1000/4;
  const lastHard = acts.find(isHard), hardGap = lastHard ? daysAgo(lastHard.date) : Infinity;
  const hard6 = acts.filter(a => isHard(a) && daysAgo(a.date) <= 6).length;
  const b = { est, ref, cfg, acts, last, since, km7, km28, mode:'run', why:[], vv: ref ? velAtVo2(ref.v) : null };
  const ctx = { vv: b.vv, acts, cfg };
  b.doneToday = acts.find(a => daysAgo(a.date) === 0);
  b.skipped = store.get('trackr.skip', '') === dkey(Date.now());
  const all = store.get('trackr.acts', []);
  b.budget = runBudget(acts, cfg);
  b.strength7 = all.filter(a => a.type === 'Strength' && daysAgo(a.date) <= 6).length;
  b.activeMin = all.filter(a => daysAgo(a.date) <= 6).reduce((s, a) => s + a.time, 0)/60000;
  let kind = null;
  const pk = ref ? pickKind(acts, b.budget, hardGap) : null;
  if(b.doneToday){ b.mode = 'done'; }
  else if(b.skipped){ b.mode = 'rest'; b.why.push('You chose to rest today. Adaptation happens during recovery, so that is a good call.'); }
  else if(!ref){ kind = 'test'; b.why.push('I have no VO2max for you yet. A 12-minute all-out test gives me a baseline to set every target from. Run as far as you can at a steady hard effort.'); }
  else if(!cfg.days.includes(dow)){ b.mode = 'rest'; b.why.push('You marked today as a day off.'); }
  else if(since >= 14 && acts.length){ kind = 'comeback'; b.why.push(`It has been ${since} days since your last run. Even if you have stayed active with the gym and walks (which helps), calves and tendons adapt to running slowly, so today is a gentle return with no hard efforts.`); }
  else if(pk.rest){ b.mode = 'rest'; b.why.push(pk.rest); }
  else {
    kind = pk.kind;
    if(kind === 'interval' || kind === 'pace'){
      if(hard6 >= 2){ kind = 'easy'; b.why.push('You have already done two hard sessions in the last 6 days. Easy today.'); }
      else if(since >= 8){ kind = 'easy'; b.why.push(isFinite(since) ? `First run after ${since} days off. Keep it easy and save the hard work for next time.` : 'No runs on record yet, so your first session is an easy one while I learn your pace.'); }
      else if(km28 > 0 && b.km7 > 1.5*Math.max(km28, 8)){ kind = 'easy'; b.why.push(`Your last 7 days (${b.km7.toFixed(0)} km) are well above your 4-week average, so I am holding back to keep you healthy.`); }
    }
  }
  if(b.mode === 'rest'){
    b.why.push(b.strength7 >= 2 ? `Strength is covered this week (${b.strength7} sessions). A relaxed walk is plenty today.` :
      `Strength matters as much as VO2max for staying strong and independent as you age (${b.strength7} of 2 sessions this week). Try 20 minutes: squats, lunges, push-ups, rows or pull-ups, and planks. Or just go for an easy walk.`);
  }
  if(b.mode === 'run' && kind){
    b.session = kind === 'test' ? makeSession('test', { vv: 0, acts, cfg }) : makeSession(kind, ctx);
    b.kind = kind;
    if(b.session.levelTxt) b.why.unshift(`${b.session.levelTxt}: ${b.session.note}.`);
    if(ref) b.why.push(`Targets use your pace at VO2max of ${kmh(b.vv)} min/km (from ${ref.label}).`);
    if(ref && (kind === 'easy' || kind === 'long' || kind === 'comeback')){
      const usual = median(acts.slice(0, 8).map(a => a.dist/(a.time/1000)));
      if(usual && usual > b.vv*.78*1.03) b.why.push(`Your usual runs average ${kmh(usual)} min/km, which is faster than easy. Slow down on purpose. Easy days make the hard days possible.`);
    }
  }
  if(ref && b.mode !== 'done'){ b.alt = makeSession(kind === 'comeback' ? 'comeback' : 'easy', ctx); }
  b.next = b.mode === 'run' ? NEXT_HINT[kind] : b.mode === 'done' ? (b.doneToday.coach && NEXT_HINT[b.doneToday.coach.kind]) || 'Tomorrow: the coach picks based on how today went.' : 'Tomorrow: back to a session.';
  const nr = normRow(profile());
  if(b.mode === 'run' && kind === 'interval' && ref && nr){
    const q = pctOf(ref.v, nr.row);
    b.why.push(`Intervals are the fastest way to raise VO2max. Your ${ref.v.toFixed(1)} is ${q.txt} for ${nr.sex === 'M' ? 'men' : 'women'} aged ${Math.floor(nr.age/10)*10}–${Math.floor(nr.age/10)*10 + 9} (${fitBand(q.p)} band). Each point you add moves you up.`);
  }
  return b;
}

/* ---------- next goal countdown + this week's circles ---------- */
const COOPER_GAP = 42;   // retest the 12-minute Cooper test every 6 weeks
function nextGoal(){
  const c = loggedReadings().filter(r => r.source === 'Cooper test').sort((a, b) => b.date - a.date)[0];
  if(!c) return null;
  const due = startOfDay(c.date) + COOPER_GAP*DAY;
  return { name: 'Next Cooper test', from: startOfDay(c.date), due, days: Math.round((due - startOfDay(Date.now()))/DAY), last: c };
}
const KIND_UI = { interval:['k-hard','Int'], pace:['k-hard','Pace'], long:['k-long','Long'], easy:['k-easy','Easy'], comeback:['k-easy','Easy'], test:['k-test','Test'] };
function actKind(a){
  if(a.type === 'Strength') return ['k-str', 'Gym'];
  if(a.type === 'Walking' || a.type === 'Cardio') return ['k-walk', a.type === 'Walking' ? 'Walk' : 'Gym'];
  if(a.coach && KIND_UI[a.coach.kind]) return KIND_UI[a.coach.kind];
  if(a.type === 'Long run') return KIND_UI.long;
  return isHard(a) ? KIND_UI.interval : KIND_UI.easy;
}
// Forecast the rest of the week with the coach's own rules, assuming each planned run gets done.
function forecastWeek(b){
  const out = {}, cfg = b.cfg, sim = b.acts.slice(), g = nextGoal();
  const fake = (k, t) => ({ date: t, dist: 0, time: 0, type: k === 'interval' ? 'Interval' : 'Pace', coach: { kind: k }, segs: [] });
  if(b.mode === 'run' && b.kind) sim.unshift(fake(b.kind, Date.now()));
  for(let k = 1; k <= 6; k++){
    const t = startOfDay(Date.now()) + k*DAY + 8*3600000, dow = new Date(t).getDay();
    if(!b.ref || !cfg.days.includes(dow)){ out[k] = null; continue; }
    if(g && startOfDay(t) === g.due){ out[k] = 'test'; sim.unshift(fake('test', t)); continue; }
    const shifted = sim.map(a => Object.assign({}, a, { date: a.date - k*DAY }));
    const lastHard = shifted.find(isHard), gap = lastHard ? daysAgo(lastHard.date) : Infinity;
    const pk = pickKind(shifted, b.budget, gap);
    let kind = pk.rest ? null : pk.kind;
    if((kind === 'interval' || kind === 'pace') && shifted.filter(a => isHard(a) && daysAgo(a.date) <= 6).length >= 2) kind = 'easy';
    out[k] = kind; if(kind) sim.unshift(fake(kind, t));
  }
  return out;
}
function renderWeekCircles(b){
  const now = new Date(), wkStart = startOfDay(Date.now()) - ((now.getDay() + 6) % 7)*DAY;
  const all = store.get('trackr.acts', []), fc = forecastWeek(b);
  const cells = [];
  for(let i = 0; i < 7; i++){
    const d0 = wkStart + i*DAY, off = Math.round((d0 - startOfDay(Date.now()))/DAY), dow = new Date(d0).getDay();
    const done = all.filter(a => startOfDay(a.date) === d0);
    let cls = '', txt = '';
    if(done.length){
      const run = done.find(a => a.dist > 0 && a.type !== 'Walking') || done[0], [k, l] = actKind(run);
      cls = 'done ' + k; txt = done.length > 1 ? l + '+' : l;
    } else if(off === 0 && b.mode === 'run' && b.kind){ const [k, l] = KIND_UI[b.kind]; cls = 'plan ' + k; txt = l; }
    else if(off > 0 && fc[off]){ const [k, l] = KIND_UI[fc[off]]; cls = 'plan ' + k; txt = l; }
    else txt = off < 0 ? '–' : 'Rest';
    cells.push(`<div class="wd${off === 0 ? ' today' : ''}"><b>${DOW[dow]}</b><div class="c ${cls}">${txt}</div>${new Date(d0).getDate()}</div>`);
  }
  $('#tWeek').innerHTML = `<h2>This week</h2><div class="wkrow">${cells.join('')}</div>
    <div class="wklg"><span><i class="k-hard"></i>hard</span><span><i class="k-easy"></i>easy</span><span><i class="k-long"></i>long</span><span><i class="k-test"></i>test</span><span><i class="k-str"></i>gym</span><span><i class="k-walk"></i>walk</span><span>dashed = planned</span></div>`;
}

function download(name, text, mime){

const fmtClock = ms => { const s = Math.max(0, Math.floor(ms/1000)), h = Math.floor(s/3600), m = Math.floor(s % 3600/60); return (h ? h + ':' + String(m).padStart(2, '0') : String(m).padStart(2, '0')) + ':' + String(s % 60).padStart(2, '0'); };
function nextSet(w){ for(let i = 0; i < w.ex.length; i++){ const j = w.ex[i].sets.findIndex(x => !x.done); if(j >= 0) return [i, j]; } return null; }
function renderGymLive(w){
  const nx = nextSet(w);
  if(nx && gymUi.open[nx[0]] === undefined && !Object.keys(gymUi.open).length) gymUi.open[nx[0]] = true;
  $('#gymBody').innerHTML = `
    <div class="glive-hd"><button class="gback" data-g="leave" aria-label="Back to workouts">←</button><div class="t"><div>${esc(w.name)}</div><div class="clock" id="gClock">${fmtClock(Date.now() - w.start)}</div></div>
      <button class="btn" data-g="discard" style="flex:none;min-height:40px;padding:8px 12px;font-size:13px;color:var(--danger)">${gymUi.discard ? 'Tap again to discard' : 'Discard'}</button></div>

        ${open ? e.sets.map((x, j) => `<div class="gset${x.done ? ' done' : ''}${nx && nx[0] === i && nx[1] === j ? ' next' : ''}"><button class="ck" data-g="ck" data-i="${i}" data-j="${j}" aria-label="Set ${j + 1} done">${x.done ? '✓' : ''}</button><span class="ix">${j + 1}</span><input data-li="${i}" data-lj="${j}" data-f="kg" type="number" inputmode="decimal" min="0" step="0.5" placeholder="–" value="${x.kg > 0 ? x.kg : ''}" aria-label="kg"><small>KG</small><input data-li="${i}" data-lj="${j}" data-f="reps" type="number" inputmode="numeric" min="0" value="${x.reps || ''}" aria-label="reps"><small>Reps</small></div>`).join('') + `<button class="gadd" data-g="setadd" data-i="${i}">+ Add a set</button>` : ''}</div>`; }).join('')}
    <div class="panel"><div class="fld" style="margin-top:0"><label style="flex:1">Add an exercise<input id="gNewEx" maxlength="60" placeholder="e.g. Lateral raise · Dumbbell" style="width:100%"></label><button class="sbtn" data-g="lexadd">Add</button></div></div>
    <div class="gbar2"><button class="btn" data-g="finish">Finish</button><button class="btn primary" data-g="next"${nx ? '' : ' disabled style="opacity:.5"'}>${nx ? 'LOG NEXT SET' : 'ALL SETS DONE'}</button></div>`;
  gymTimer = setInterval(() => { const c = $('#gClock'); if(c && $('#gymView').classList.contains('on')) c.textContent = fmtClock(Date.now() - w.start); else clearInterval(gymTimer); }, 1000);

function startWorkout(t){
  const last = store.get('trackr.acts', []).filter(a => a.gym && a.gym.tplId === t.id).sort((a, b) => b.date - a.date)[0];
  saveLive({ tplId: t.id, name: t.name, start: Date.now(), ex: t.ex.map(e => {
    const prev = last && last.gym.ex.find(x => x.n === e.n), top = prev && prev.sets.length ? prev.sets[prev.sets.length - 1] : null;
    return { n: e.n, sets: Array.from({ length: e.sets }, () => ({ kg: top ? top.kg : e.kg || 0, reps: e.reps, done: false })) };   // weights carry over from last time
  }) });
  gymUi.mode = 'live'; gymUi.open = {}; gymUi.discard = 0; buzz(30); renderGym();
}
function finishWorkout(){
  const w = gymLive(); if(!w) return;
  const ex = w.ex.map(e => ({ n: e.n, sets: e.sets.filter(x => x.done).map(x => ({ kg: +x.kg || 0, reps: +x.reps || 0 })) })).filter(e => e.sets.length);
  if(!ex.length){ toast('Tick at least one set, or Discard the workout.'); return; }
  const time = Math.max(60000, Date.now() - w.start);
  const note = ex.map(e => `${e.n}: ${e.sets.map(x => (x.kg ? x.kg + '×' : '') + x.reps).join(', ')}`).join('\n');
  const list = store.get('trackr.acts', []);
  list.push({ id: 'g' + w.start, type: 'Strength', manual: true, date: w.start, dist: 0, time, gain: 0, segs: [], laps: [], note, gym: { tplId: w.tplId, name: w.name, ex } });
  store.set('trackr.acts', list.sort((a, b) => b.date - a.date));
  // the template remembers today's working weight for next time
  const tpl = gymTpls(), t = tpl.find(x => x.id === w.tplId);
  if(t){ ex.forEach(e => { const te = t.ex.find(x => x.n === e.n), top = e.sets[e.sets.length - 1]; if(te && top.kg) te.kg = top.kg; }); saveTpls(tpl); }
  store.del('trackr.gymLive'); gymUi.mode = 'list'; gymUi.open = {};
  buzz([40, 60, 40]); toast(`Workout saved: ${Math.round(time/60000)} min, ${ex.reduce((s, e) => s + e.sets.length, 0)} sets`);
  renderGym(); renderList();
}

$('#gymBody').addEventListener('click', e => {
  const b = e.target.closest('[data-g]'); if(!b) return;
  const g = b.dataset.g, id = b.dataset.id, i = +b.dataset.i;
  if(g !== 'discard' && g !== 'tdel') gymUi.discard = 0;
  if(g === 'new'){ gymUi.draft = { id: null, name: '', ex: [{ n: '', sets: 3, reps: 8, kg: 0 }] }; gymUi.mode = 'edit'; renderGym(); $('#gName').focus(); }
  else if(g === 'edit'){ const t = gymTpls().find(x => x.id === id); if(t){ gymUi.draft = JSON.parse(JSON.stringify(t)); gymUi.mode = 'edit'; renderGym(); } }
  else if(g === 'expand'){ gymUi.expand[id] = !gymUi.expand[id]; renderGym(); }
  else if(g === 'start'){
    if(gymLive()){ toast('Finish or discard the workout in progress first.'); gymUi.mode = 'live'; renderGym(); return; }
    const t = gymTpls().find(x => x.id === id); if(t) startWorkout(t);
  }
  else if(g === 'resume'){ gymUi.mode = 'live'; renderGym(); }
  else if(g === 'del'){ store.set('trackr.acts', store.get('trackr.acts', []).filter(a => a.id !== id)); toast('Session deleted'); renderGym(); renderList(); }
  else if(g === 'quick'){
    const min = Math.round(+$('#gMin').value), kind = $('#gType').value, day = $('#gDate').value;
    if(!(min >= 5 && min <= 240)){ toast('Enter between 5 and 240 minutes.'); return; }
    let t = Date.now();
    if(day && day !== isoDay(t)){ const [y, m, dd] = day.split('-').map(Number); t = new Date(y, m - 1, dd, 12).getTime(); if(!(t <= Date.now())){ toast('Pick today or an earlier date.'); return; } }   // past days are stamped at midday
    const list = store.get('trackr.acts', []);
    list.push({ id: 'm' + Date.now(), type: kind, manual: true, date: t, dist: 0, time: min*60000, gain: 0, segs: [], laps: [] });
    store.set('trackr.acts', list.sort((a, b) => b.date - a.date)); buzz(40);
    toast(`${kind === 'Walking' ? 'Walk' : kind === 'Cardio' ? 'Cardio' : 'Gym'} logged: ${min} min`); renderGym(); renderList();
  }
  // editor
  else if(g === 'cancel'){ gymUi.mode = 'list'; gymUi.draft = null; renderGym(); }
  else if(g === 'exadd'){ const d = gymUi.draft, l = d.ex[d.ex.length - 1]; d.ex.push({ n: '', sets: l ? l.sets : 3, reps: l ? l.reps : 8, kg: 0 }); renderGymEdit(); const ins = document.querySelectorAll('.gedrow input.n'); ins[ins.length - 1].focus(); }
  else if(g === 'exdel'){ gymUi.draft.ex.splice(i, 1); renderGymEdit(); }
  else if(g === 'save'){
    const d = gymUi.draft; d.name = $('#gName').value.trim();
    d.ex = d.ex.map(x => ({ n: x.n.trim(), sets: clamp(Math.round(+x.sets) || 3, 1, 20), reps: clamp(Math.round(+x.reps) || 8, 1, 100), kg: Math.max(0, +x.kg || 0) })).filter(x => x.n);
    if(!d.name){ toast('Give the workout a name.'); $('#gName').focus(); return; }
    if(!d.ex.length){ toast('Add at least one exercise.'); return; }
    const tpl = gymTpls();
    if(d.id){ const k = tpl.findIndex(x => x.id === d.id); if(k >= 0) tpl[k] = d; else tpl.push(d); } else { d.id = 't' + Date.now(); tpl.push(d); }
    saveTpls(tpl); gymUi.mode = 'list'; gymUi.draft = null; toast('Workout saved'); renderGym();
  }
  else if(g === 'tdel'){
    if(!gymUi.discard){ gymUi.discard = 1; renderGymEdit(); return; }
    saveTpls(gymTpls().filter(x => x.id !== gymUi.draft.id)); gymUi.discard = 0; gymUi.mode = 'list'; gymUi.draft = null; toast('Workout deleted'); renderGym();
  }
  // live workout
  else {
    const w = gymLive(); if(!w) return;
    if(g === 'leave'){ gymUi.mode = 'list'; renderGym(); }
    else if(g === 'toggle'){ if(e.target.closest('.gx')) return; gymUi.open[i] = !gymUi.open[i]; renderGymLive(w); }
    else if(g === 'ck'){ const x = w.ex[i].sets[+b.dataset.j]; x.done = !x.done; saveLive(w); if(x.done) buzz(30); renderGymLive(w); }
    else if(g === 'setadd'){ const s = w.ex[i].sets, l = s[s.length - 1]; s.push({ kg: l ? l.kg : 0, reps: l ? l.reps : 8, done: false }); saveLive(w); renderGymLive(w); }
    else if(g === 'lexdel'){ w.ex.splice(i, 1); gymUi.open = {}; saveLive(w); renderGymLive(w); }
    else if(g === 'lexadd'){
      const n = $('#gNewEx').value.trim(); if(!n){ $('#gNewEx').focus(); return; }
      w.ex.push({ n, sets: [0, 1, 2].map(() => ({ kg: 0, reps: 8, done: false })) }); gymUi.open = { [w.ex.length - 1]: true }; saveLive(w); renderGymLive(w);
    }
    else if(g === 'next'){
      const nx = nextSet(w); if(!nx) return;
      w.ex[nx[0]].sets[nx[1]].done = true; saveLive(w); buzz(30);
      const after = nextSet(w); gymUi.open = after ? { [after[0]]: true } : { [nx[0]]: true }; renderGymLive(w);
      toast(`${w.ex[nx[0]].n}: set ${nx[1] + 1} logged`);
    }
    else if(g === 'finish') finishWorkout();
    else if(g === 'discard'){
      if(!gymUi.discard){ gymUi.discard = 1; renderGymLive(w); return; }
      store.del('trackr.gymLive'); gymUi.discard = 0; gymUi.mode = 'list'; gymUi.open = {}; toast('Workout discarded'); renderGym();
    }
  }
});

/* ---------- cloud sync (Supabase) ---------- */
// localStorage stays the copy the app reads and writes, so recording works with no signal.
// Changes to the keys below are queued and pushed to Supabase when online; other devices pull them.
// Talks to Supabase's REST API with fetch (no library). Tables: supabase/trackr.sql.
// No sign-in: the tables are open to anyone holding this publishable key, which is public in this repo.
const SUPABASE_URL = 'https://ixyfuoaehgkhjpcqdwfa.supabase.co';
const SUPABASE_KEY = 'sb_publishable_oawYAqR_CbuGwDIQcxUUKQ_pXhPTP35';
(function cloudSync(){
  const SETTINGS = ['vo2', 'coach', 'profile', 'ref', 'skip', 'gym'];   // trackr.<name>; draft, gymLive, sensor and sat stay on this device
  if(!/^https:\/\//.test(SUPABASE_URL) || SUPABASE_KEY.length < 20){ $('#cloudMsg').textContent = 'Not set up: this build has no Supabase project. Everything stays on this phone.'; return; }
  const S = Object.assign({ acts: {}, keys: {}, curA: null, curS: null, first: true, last: 0, err: '' }, store.get('trackr.cloud', {}));
  let busy = null, again = false, timer = 0;
  const keep = () => { try{ localStorage.setItem('trackr.cloud', JSON.stringify(S)); }catch(e){} };
  const waiting = () => Object.keys(S.acts).length + Object.keys(S.keys).length;

  // queue local changes (called by store.set / store.del)
  store.onSet = (k, v, prev) => {
    if(k === 'trackr.acts'){
      let old = []; try{ old = JSON.parse(prev) || []; }catch(e){}
      const was = new Map(old.map(a => [a.id, JSON.stringify(a)])), now = new Set();
      (v || []).forEach(a => { now.add(a.id); if(was.get(a.id) !== JSON.stringify(a)) S.acts[a.id] = 1; });
      was.forEach((_, id) => { if(!now.has(id)) S.acts[id] = 'del'; });
    }else if(k.startsWith('trackr.') && SETTINGS.includes(k.slice(7))) S.keys[k.slice(7)] = 1;
    else return;
    keep(); ui(); soon(2000);
  };

  async function call(path, opt = {}){
    const h = { apikey: SUPABASE_KEY, 'Content-Type': 'application/json' };
    if(SUPABASE_KEY.startsWith('eyJ')) h.Authorization = 'Bearer ' + SUPABASE_KEY;   // legacy anon key; publishable keys go in apikey only
    const r = await fetch(SUPABASE_URL + path, Object.assign({}, opt, { headers: Object.assign(h, opt.headers || {}) }));
    if(!r.ok){
      let m = 'error ' + r.status; try{ const j = await r.json(); m = j.message || j.msg || j.error || m; }catch(e){}
      throw new Error(m);
    }
    return r.status === 204 || r.status === 201 ? null : r.json();
  }
  // everything changed since the last pull
  async function pull(table, cur){
    const rows = [];
    for(;;){
      const page = await call(`/rest/v1/${table}?select=*&order=updated_at.asc&limit=500` + (cur ? '&updated_at=gt.' + encodeURIComponent(cur) : ''));
      rows.push(...page); if(page.length) cur = page[page.length - 1].updated_at;
      if(page.length < 500) return { rows, cur };
    }
  }
  const upsert = (table, rows) => call(`/rest/v1/${table}`, { method: 'POST', headers: { Prefer: 'resolution=merge-duplicates,return=minimal' }, body: JSON.stringify(rows) });

  async function sync(){
    // 1. pull; anything with a change still waiting on this phone keeps the local copy
    const A = await pull('trackr_activities', S.curA);
    let list = store.get('trackr.acts', []), changed = false;
    const byId = new Map(list.map(a => [a.id, a])), seen = new Set();
    A.rows.forEach(r => {
      seen.add(r.id);
      if(S.acts[r.id]) return;
      if(r.deleted || !r.data){ if(byId.delete(r.id)) changed = true; }
      else if(JSON.stringify(byId.get(r.id)) !== JSON.stringify(r.data)){ byId.set(r.id, r.data); changed = true; }
    });
    if(changed){ list = [...byId.values()].sort((a, b) => b.date - a.date); localStorage.setItem('trackr.acts', JSON.stringify(list)); }
    const B = await pull('trackr_settings', S.curS), seenK = new Set();
    B.rows.forEach(r => {
      seenK.add(r.key);
      if(S.keys[r.key] || !SETTINGS.includes(r.key)) return;
      const k = 'trackr.' + r.key, v = r.value == null ? null : JSON.stringify(r.value);
      if(localStorage.getItem(k) !== v){ v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); changed = true; }
    });
    if(S.first){   // first sync on this device: upload whatever the cloud doesn't have yet
      list.forEach(a => { if(!seen.has(a.id)) S.acts[a.id] = 1; });
      SETTINGS.forEach(k => { if(!seenK.has(k) && localStorage.getItem('trackr.' + k) != null) S.keys[k] = 1; });
    }
    S.curA = A.cur; S.curS = B.cur; S.first = false; keep();
    if(changed){ try{ renderList(); }catch(e){} try{ if($('#todayView').classList.contains('on')) renderToday(); }catch(e){} try{ if($('#gymView').classList.contains('on') && gymUi.mode === 'list') renderGym(); }catch(e){} }

    // 2. push activities in batches of about 1 MB (a delete is kept as deleted = true)
    const have = new Map(store.get('trackr.acts', []).map(a => [a.id, a]));
    let batch = [], size = 0;
    const send = async () => {
      if(!batch.length) return;
      await upsert('trackr_activities', batch.map(x => x.row));
      batch.forEach(x => { if(S.acts[x.row.id] === x.mark) delete S.acts[x.row.id]; }); keep(); batch = []; size = 0;
    };
    for(const id of Object.keys(S.acts)){
      const a = have.get(id), n = a ? JSON.stringify(a).length : 50;
      if(size + n > 1e6) await send();
      batch.push({ row: { id, data: a || null, deleted: !a }, mark: S.acts[id] }); size += n;
    }
    await send();
    const keys = Object.keys(S.keys);
    if(keys.length){
      const main = keys.filter(k => k !== 'gym');
      if(main.length){ await upsert('trackr_settings', main.map(k => ({ key: k, value: store.get('trackr.' + k, null) }))); main.forEach(k => delete S.keys[k]); keep(); }
      if(S.keys.gym){   // a database set up before the Gym tab rejects this key until supabase/trackr.sql is run again; keep it queued and carry on
        try{ await upsert('trackr_settings', [{ key: 'gym', value: store.get('trackr.gym', null) }]); delete S.keys.gym; S.gymErr = ''; }
        catch(e){ if(/check|constraint|violat/i.test(e.message)) S.gymErr = 'Gym workouts are not syncing yet: run supabase/trackr.sql again in the Supabase SQL editor.'; else throw e; }
        keep();
      }
    }
  }
  async function run(){
    if(busy){ again = true; return busy; }
    if(navigator.onLine === false){ ui(); return; }
    busy = (async () => {
      try{ do{ again = false; await sync(); }while(again); S.last = Date.now(); S.err = ''; }
      catch(e){ S.err = /fetch|network|load failed/i.test(e.message) ? 'no connection' : e.message; }
      keep(); busy = null; ui();
    })();
    ui(); return busy;
  }
  function soon(ms){ clearTimeout(timer); timer = setTimeout(run, ms); }

  function ago(t){ const s = (Date.now() - t) / 1000; return s < 60 ? 'just now' : s < 3600 ? Math.round(s / 60) + ' min ago' : s < 86400 ? Math.round(s / 3600) + ' h ago' : new Date(t).toLocaleDateString(); }
  function ui(){
    const n = waiting(), off = navigator.onLine === false;
    $('#cloudBadge').textContent = '· ' + (busy ? 'syncing…' : off && n ? n + ' waiting' : S.err ? 'not synced' : n ? n + ' waiting' : 'on');
    $('#cloudMsg').textContent = 'Activities, VO2max readings and coach settings are copied to your Supabase database, and every device running Trackr shares them. '
      + (S.gymErr ? S.gymErr + ' ' : '') + (busy ? 'Syncing…' : off ? `Offline: ${n} change${n === 1 ? '' : 's'} will upload when you're back online.` : S.err ? `Last sync failed (${S.err}). ${n ? n + ' change' + (n === 1 ? '' : 's') + ' waiting. ' : ''}It retries automatically.` : S.last ? `Synced ${ago(S.last)}.` : 'Not synced yet.');
  }
  $('#cloudNow').onclick = () => run();
  $('#cloud').addEventListener('toggle', ui);
  addEventListener('online', () => soon(500));
  addEventListener('offline', ui);
  document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible') soon(800); });
  setInterval(() => { if(document.visibilityState === 'visible') run(); }, 5 * 60000);
  ui(); soon(1500);
})();

/* ---------- repair recordings made while the profile used the phone's own speed ---------- */
// Between the Doppler change and its reversal, recordings stored the phone-speed profile in `prof`. Rebuild `prof` from positions and keep the old one as `dop`.
(function repairProfiles(){
  const DOP_FROM = 1791023504000;   // 3 Oct 2026 18:31 MYT, when the Doppler profile went live
  const list = store.get('trackr.acts', []); let n = 0;
  list.forEach(a => {
    if(/^\d+$/.test(a.id) && !a.dop && a.date >= DOP_FROM && a.prof && a.segs){
      const p = makeProfile(a.segs); if(p){ a.dop = a.prof; a.prof = p; n++; }
    }
  });
  if(n) store.set('trackr.acts', list);
})();

/* ---------- restore an unfinished recording ---------- */
const draft = store.get('trackr.draft', null);
if(draft && draft.segs && (draft.status === 'running' || draft.status === 'paused')){
  if(draft.status === 'running') draft.elapsed += Date.now() - draft.tickAt;   // time the page was closed counts as moving only up to now; user can pause
  draft.status = 'paused'; act = draft; type = act.type;
  if(!act.laps){ act.laps = []; act.lapT0 = 0; act.lapD0 = 0; }
  document.querySelectorAll('#types button').forEach(x => x.classList.toggle('on', x.dataset.type === type));
  toast('Restored your unfinished activity (paused).');
}
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {});   // also in the Android app, which loads from GitHub Pages and needs this cache to open offline
protectStorage();
render(); renderList(); drawSpark();
if(act) showTab('rec'); else renderToday();   // opening the app mid-run goes to the run; otherwise to today's briefing
if(act && act.segs.some(s => s.length)){ const l = act.segs.flat(); map.setView([l[l.length-1][0], l[l.length-1][1]], 16); }
})();
</script>
