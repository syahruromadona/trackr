<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Trackr</title>
<style>
:root{--bg:#fff;--ink:#1b1b1f;--muted:#6b6b76;--accent:#fc4c02}
@media (prefers-color-scheme: dark){:root{--bg:#121214;--ink:#f2f2f5;--muted:#9a9aa6}}
body{margin:0;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;box-sizing:border-box;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;text-align:center}
h1{margin:0;font-size:22px}
p{margin:0;color:var(--muted);max-width:340px}
a{display:inline-block;margin-top:8px;padding:14px 28px;border-radius:12px;background:var(--accent);color:#fff;font-weight:700;text-decoration:none}
</style>
</head>
<body>
<!-- Shown by the Android app when it can't load Trackr from GitHub Pages and has no saved copy yet. -->
<h1>Trackr needs internet once</h1>
<p>The app loads from your Trackr website and keeps a copy for offline use. Connect to Wi-Fi or mobile data for the first launch, then it works without signal.</p>
<a href="https://syahruromadona.github.io/trackr/">Try again</a>
</body>
</html>
